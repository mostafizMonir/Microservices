services:
  loadtestpostgresrediscache:
    image: ${DOCKER_REGISTRY-}loadtestpostgresrediscache
    build:
      context: .
      dockerfile: LoadTestPostgresRedisCache/Dockerfile
    depends_on:       
      - postgresdb
      - rabbitmq
    ports:
      - "5003:8080"

  postgresdb:
    image: postgres:latest
    container_name: postgrescontainer
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "1234:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  newsletter.api:
    image: ${DOCKER_REGISTRY-}newsletterapi
    build:
      context: .
      dockerfile: NewsLetter.API/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    depends_on:       
      - postgresdb
      - rabbitmq

  newsletter.reporting.api:
    image: ${DOCKER_REGISTRY-}newsletterreportingapi
    build:
      context: .
      dockerfile: NewsLetter.Reporting.API/Dockerfile
    ports:
       - "5002:8080"
    depends_on:       
      - postgresdb
      - rabbitmq


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq    
    ports:
      - "5672:5672"    # AMQP protocol (for apps)
      - "15672:15672"  # HTTP UI (management console)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  webhooks.api:
    image: ${DOCKER_REGISTRY-}webhooksapi
    build:
      context: .
      dockerfile: Webhooks.Api/Dockerfile

volumes:
  pgdata:
  rabbitmq_data:
  redis_data:



